syntax = "proto3";

package knowledge.v1;

option go_package = "github.com/yuyu945/AI-Shopping/services/knowledge-service/gen;knowledgepb";

// KnowledgeService owns product document metadata and asynchronous ingest events.
service KnowledgeService {
  rpc UploadDocument(UploadDocumentRequest) returns (UploadDocumentResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc RetryDocument(RetryDocumentRequest) returns (RetryDocumentResponse);
  rpc SearchProductKnowledge(SearchProductKnowledgeRequest) returns (SearchProductKnowledgeResponse);
}

message UploadDocumentRequest {
  uint64 product_id = 1;
  string doc_type = 2;
  string file_name = 3;
  string content_type = 4;
  string content_base64 = 5;
}

message UploadDocumentResponse {
  Document document = 1;
}

message Document {
  string document_no = 1;
  uint64 product_id = 2;
  string doc_type = 3;
  uint32 version = 4;
  string status = 5;
  string file_name = 6;
  string content_type = 7;
  uint64 file_size_bytes = 8;
  uint32 chunk_count = 9;
  string embedding_model = 10;
  bool is_current_ready = 11;
  string error_code = 12;
  string error_message = 13;
  string created_at = 14;
  string updated_at = 15;
  string processed_at = 16;
  string ready_at = 17;
}

message ListDocumentsRequest {
  uint64 product_id = 1;
  string doc_type = 2;
  string status = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  string next_page_token = 2;
}

message GetDocumentRequest {
  string document_no = 1;
}

message GetDocumentResponse {
  Document document = 1;
  repeated DocumentChunk chunks = 2;
}

message RetryDocumentRequest {
  string document_no = 1;
}

message RetryDocumentResponse {
  Document document = 1;
}

message DocumentChunk {
  uint64 chunk_id = 1;
  uint32 chunk_index = 2;
  string section = 3;
  uint32 source_page = 4;
  string content_hash = 5;
  string status = 6;
  string vector_ref = 7;
}

message SearchProductKnowledgeRequest {
  uint64 product_id = 1;
  string query = 2;
  repeated string doc_types = 3;
  uint32 top_k = 4;
}

message SearchProductKnowledgeResponse {
  repeated KnowledgeSnippet snippets = 1;
  string fallback_reason = 2;
}

message KnowledgeSnippet {
  uint64 chunk_id = 1;
  string document_no = 2;
  uint64 product_id = 3;
  string doc_type = 4;
  uint32 version = 5;
  string section = 6;
  uint32 source_page = 7;
  string content = 8;
  double score = 9;
}
