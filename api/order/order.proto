syntax = "proto3";

package order.v1;

option go_package = "github.com/yuyu945/AI-Shopping/services/order-service/gen;orderpb";

// OrderService owns authenticated cart and order operations. The caller's
// identity is derived from validated transport authentication, never from RPC input.
service OrderService {
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  rpc AddCartItem(AddCartItemRequest) returns (CartItemResponse);
  rpc UpdateCartItem(UpdateCartItemRequest) returns (Empty);
  rpc DeleteCartItem(DeleteCartItemRequest) returns (Empty);
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc PayWallet(PayWalletRequest) returns (OrderResponse);
  // GetPaymentSettlementStatus is an internal service-token protected read used only by reservation expiry recovery.
  rpc GetPaymentSettlementStatus(GetPaymentSettlementStatusRequest) returns (GetPaymentSettlementStatusResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
}

message GetCartRequest {}

message GetCartResponse {
  Cart cart = 1;
}

message AddCartItemRequest {
  uint64 sku_id = 1;
  uint32 quantity = 2;
  bool selected = 3;
}

message UpdateCartItemRequest {
  uint64 cart_item_id = 1;
  uint32 quantity = 2;
  bool selected = 3;
}

message DeleteCartItemRequest {
  uint64 cart_item_id = 1;
}

message CartItemResponse {
  CartItem item = 1;
}

message Cart {
  repeated CartItem items = 1;
}

message CartItem {
  uint64 cart_item_id = 1;
  uint64 sku_id = 2;
  uint32 quantity = 3;
  bool selected = 4;
}

message CreateOrderRequest {
  string request_id = 1;
  uint64 address_id = 2;
}

message PayWalletRequest {
  string order_no = 1;
}

message GetPaymentSettlementStatusRequest {
  string order_no = 1;
  string payment_attempt_id = 2;
}

message GetPaymentSettlementStatusResponse {
  string status = 1;
}

message ListOrdersRequest {}

message ListOrdersResponse {
  repeated Order orders = 1;
}

message GetOrderRequest {
  string order_no = 1;
}

message OrderResponse {
  Order order = 1;
}

message Order {
  string order_no = 1;
  string request_id = 2;
  string status = 3;
  string total_amount = 4;
  string paid_amount = 5;
  ShippingAddressSnapshot shipping_address = 6;
  repeated OrderItem items = 7;
}

message ShippingAddressSnapshot {
  string receiver_name = 1;
  string receiver_phone = 2;
  string province = 3;
  string city = 4;
  string district = 5;
  string detail = 6;
}

message OrderItem {
  uint64 product_id = 1;
  uint64 sku_id = 2;
  string product_title = 3;
  string sku_code = 4;
  bytes sku_spec_json = 5;
  // Candidate promotions are checkout facts; they are not necessarily applied.
  repeated PromotionSnapshot candidate_promotions = 6;
  string unit_price = 7;
  string discount_amount = 8;
  uint32 quantity = 9;
  string item_amount = 10;
  // Unset when no promotion is applied to this order item.
  PromotionSnapshot applied_promotion = 11;
}

message PromotionSnapshot {
  uint64 promotion_id = 1;
  string rule_type = 2;
  optional string threshold_amount = 3;
  optional string discount_amount = 4;
}

message Empty {}
