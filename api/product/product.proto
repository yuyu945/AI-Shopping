syntax = "proto3";

package product.v1;

option go_package = "github.com/yuyu945/AI-Shopping/services/product-service/gen;productpb";

service ProductService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc GetCheckoutSKUs(CheckoutSKUsRequest) returns (CheckoutSKUsResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReservationResponse);
  rpc ConfirmReservation(ReservationActionRequest) returns (ReservationResponse);
  rpc ReleaseReservation(ReservationActionRequest) returns (ReservationResponse);
  rpc GetReservation(GetReservationRequest) returns (ReservationResponse);
}

message ListProductsRequest {
  string keyword = 1;
  uint64 category_id = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message GetProductRequest {
  uint64 product_id = 1;
  optional uint64 sku_id = 2;
}

message ListProductsResponse {
  repeated ProductSummary products = 1;
}

message GetProductResponse {
  Product product = 1;
}

message CheckoutSKUsRequest {
  repeated uint64 sku_ids = 1;
}

message CheckoutSKUsResponse {
  repeated CheckoutSKU skus = 1;
}

// ReserveStock is a service-to-service request constructed from a persisted
// payment attempt. It deliberately contains no user identity.
message ReserveStockRequest {
  string reservation_id = 1;
  string order_no = 2;
  string payment_attempt_id = 3;
  repeated ReservationItem items = 4;
  int64 expires_at_unix_milli = 5;
}

message ReservationActionRequest {
  string reservation_id = 1;
}

message GetReservationRequest {
  string reservation_id = 1;
}

message ReservationResponse {
  Reservation reservation = 1;
}

message Reservation {
  string reservation_id = 1;
  string order_no = 2;
  string payment_attempt_id = 3;
  string status = 4;
  int64 expires_at_unix_milli = 5;
  optional int64 confirmed_at_unix_milli = 6;
  optional int64 released_at_unix_milli = 7;
  repeated ReservationItem items = 8;
}

message ReservationItem {
  uint64 sku_id = 1;
  uint32 quantity = 2;
}

message CheckoutSKU {
  uint64 product_id = 1;
  uint64 sku_id = 2;
  string product_title = 3;
  string sku_code = 4;
  bytes spec_json = 5;
  string sale_price = 6;
  bool saleable = 7;
  repeated PromotionSummary promotions = 8;
}

message ProductSummary {
  uint64 product_id = 1;
  uint64 category_id = 2;
  string title = 3;
  optional string subtitle = 4;
  optional string min_sale_price = 5;
  uint64 stock_qty = 6;
  string stock_status = 7;
}

message Product {
  uint64 product_id = 1;
  uint64 category_id = 2;
  string title = 3;
  optional string subtitle = 4;
  optional string detail_markdown = 5;
  repeated Sku skus = 6;
  repeated ImageRef images = 7;
  repeated PromotionSummary promotions = 8;
}

message Sku {
  uint64 sku_id = 1;
  string sku_code = 2;
  map<string, string> specs = 3;
  string sale_price = 4;
  uint64 stock_qty = 5;
  string stock_status = 6;
}

message ImageRef {
  uint64 image_id = 1;
  string object_key = 2;
  uint64 sort_no = 3;
}

message PromotionSummary {
  uint64 promotion_id = 1;
  string rule_type = 2;
  optional string threshold_amount = 3;
  optional string discount_amount = 4;
}
