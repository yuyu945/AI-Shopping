syntax = "proto3";

package user.v1;

option go_package = "github.com/yuyu945/AI-Shopping/services/user-service/gen;userpb";

service UserService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse);
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (GetMyProfileResponse);
  rpc ListMyAddresses(ListMyAddressesRequest) returns (ListMyAddressesResponse);
  rpc CreateMyAddress(CreateMyAddressRequest) returns (AddressResponse);
  rpc UpdateMyAddress(UpdateMyAddressRequest) returns (AddressResponse);
  rpc DeleteMyAddress(DeleteMyAddressRequest) returns (Empty);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string access_token = 1;
  string expires_at = 2;
  UserSummary user = 3;
}

message UserSummary {
  uint64 user_id = 1;
  string email = 2;
}

message GetMyProfileRequest {}

message GetMyProfileResponse {
  UserProfile profile = 1;
}

message UpdateMyProfileRequest {
  optional bytes preference_json = 1;
  optional string budget_min = 2;
  optional string budget_max = 3;
}

message UserProfile {
  UserSummary user = 1;
  optional bytes preference_json = 2;
  optional string budget_min = 3;
  optional string budget_max = 4;
  uint64 profile_version = 5;
}

message ListMyAddressesRequest {}

message ListMyAddressesResponse {
  repeated Address addresses = 1;
}

message CreateMyAddressRequest {
  string receiver_name = 1;
  string receiver_phone = 2;
  string province = 3;
  string city = 4;
  string district = 5;
  string detail = 6;
  bool is_default = 7;
}

message UpdateMyAddressRequest {
  uint64 address_id = 1;
  string receiver_name = 2;
  string receiver_phone = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  string detail = 7;
  bool is_default = 8;
}

message DeleteMyAddressRequest {
  uint64 address_id = 1;
}

message AddressResponse {
  Address address = 1;
}

message Address {
  uint64 address_id = 1;
  string receiver_name = 2;
  string receiver_phone = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  string detail = 7;
  bool is_default = 8;
}

message Empty {}
