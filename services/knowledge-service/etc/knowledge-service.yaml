Name: knowledge-service
ListenOn: 0.0.0.0:9004
Timeout: 2000
Upload:
  Bucket: knowledge
  MaxFileBytes: 2097152
  MinIOSecure: false
Outbox:
  PollInterval: 1s
  BatchSize: 50
  LeaseDuration: 30s
  CallTimeout: 250ms
  MaxAttempts: 5
Embedding:
  Provider: dashscope
  Model: text-embedding-v4
  Dimension: 1024
  Timeout: 5s
VectorStore:
  Backend: milvus
  Collection: knowledge_chunks
  Timeout: 5s
