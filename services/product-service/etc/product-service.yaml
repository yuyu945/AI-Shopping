Name: product-service
ListenOn: 0.0.0.0:9002
Timeout: 2000
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: product-service.rpc
CacheInvalidation:
  PollInterval: 1s
  BatchSize: 50
  DelayedDeleteDelay: 1s
  LeaseDuration: 30s
  MaxRetries: 5
  RetryBaseDelay: 1s
  RetryMaxDelay: 30s
ConfirmationConsumer:
  CallTimeout: 2s
